/* Layout: full-bleed hand-drawn street map; a price list / venue card sits as a bottom sheet on phones and a left rail on wide screens. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #14181d;
  --muted: #5a6470;
  --line: #dde2e7;
  --tag: #f2b233;          /* amber price tag: the one bold color */
  --tag-ink: #1b1710;
  --mit: #a31f34;           /* MIT cardinal red: logo badge */
  --mit-text: #a31f34;      /* cardinal for type; lightened in dark mode for contrast */
  --mit-silver: #8a8b8c;    /* MIT silver gray */
  --tag-dim: #c9ced4;
  --tag-dim-ink: #3f4752;
  --best: #1f8a4c;         /* three cheapest */
  --best-ink: #ffffff;
  --link: #1f5f99;
  --ok: #2f7d4f;
  --danger: #b4372f;
  --land: #e9ecef;
  --road: #ffffff;
  --road-mid: #fbf3df;
  --road-major: #f6dfa4;
  --water: #b7d1e4;
  --park: #d3e4cd;
  --rail: #b9c0c8;
  --radius: #1f5f99;
  --label: #6c7682;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --shadow: 0 6px 24px rgba(20, 30, 45, .14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #181d23; --fg: #e8ebee; --muted: #9aa4af; --line: #2a3139;
    --tag: #f2b233; --tag-ink: #1b1710; --mit: #a31f34; --mit-text: #e8687b; --mit-silver: #a5a6a7;
    --tag-dim: #3a424c; --tag-dim-ink: #c4cbd3; --best: #3fb06f; --best-ink: #0b1a10;
    --link: #8cc0ee; --ok: #6cc28f; --danger: #ef7d74;
    --land: #171b20; --road: #262c34; --road-mid: #2f343b; --road-major: #4a4130; --water: #13324a;
    --park: #1b2a20; --rail: #3a424c; --radius: #8cc0ee; --label: #7f8a96;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #181d23; --fg: #e8ebee; --muted: #9aa4af; --line: #2a3139;
  --tag: #f2b233; --tag-ink: #1b1710; --mit: #a31f34; --mit-text: #e8687b; --mit-silver: #a5a6a7;
  --tag-dim: #3a424c; --tag-dim-ink: #c4cbd3; --best: #3fb06f; --best-ink: #0b1a10;
  --link: #8cc0ee; --ok: #6cc28f; --danger: #ef7d74;
  --land: #171b20; --road: #262c34; --road-mid: #2f343b; --road-major: #4a4130; --water: #13324a;
  --park: #1b2a20; --rail: #3a424c; --radius: #8cc0ee; --label: #7f8a96;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
a { color: var(--link); }
.ico { width: 16px; height: 16px; flex: none; }

#app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* top bar */
.bar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 1100;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-right: auto; }
.brand p { margin: 0; color: var(--mit-silver); font-size: 13px; padding-left: 12px; border-left: 1px solid var(--mit-silver); }

/* logo: cardinal badge holding a white mug whose bubbles are MIT-style vertical bars; wordmark in black + cardinal */
.logo { display: inline-flex; align-items: center; gap: 9px; margin: 0; white-space: nowrap; font: 700 23px/1 var(--f-body); letter-spacing: -.025em; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo .w1 { color: var(--fg); }
.logo .w2 { color: var(--mit-text); }
.logo.big { font-size: 44px; gap: 14px; }
.logo.big svg { width: 62px; height: 62px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 8px 12px; font-weight: 600; font-size: 14px; min-height: 40px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.tag { background: var(--tag); color: var(--tag-ink); border-color: var(--tag); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

@media (max-width: 560px) {
  .brand p { display: none; }
  .logo { font-size: 21px; }
  .logo svg { width: 30px; height: 30px; }
  .add-long { display: none; }
}

/* map */
#mapWrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--land); }
.leaflet-container { font-family: var(--f-body); }
.leaflet-bar { border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); }
.leaflet-bar a { background: var(--surface); color: var(--fg); width: 36px; height: 36px; line-height: 36px; border-bottom: 1px solid var(--line); }
.leaflet-bar a:last-child { border-bottom: 0; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--muted); font-size: 11px; }
.leaflet-control-attribution a { color: var(--muted); }

.area-label { font: 700 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--label); white-space: nowrap; transform: translate(-50%, -50%); position: absolute; pointer-events: none; }
.area-label.river { font-style: italic; letter-spacing: .3em; color: color-mix(in srgb, var(--water) 40%, var(--label)); }
.mit-dot { position: absolute; transform: translate(-50%, -50%); width: 14px; height: 14px; border-radius: 50%; background: var(--radius); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--radius); }

/* price-tag pins */
.pin-wrap { width: 0 !important; height: 0 !important; }
.pin {
  position: absolute; left: 0; bottom: 7px; transform: translateX(-50%);
  font: 600 13px/1 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap;
  padding: 5px 7px; border-radius: 6px; background: var(--tag); color: var(--tag-ink);
  border: 1.5px solid var(--tag-ink); box-shadow: 0 2px 6px rgba(0,0,0,.25);
  transition: transform .12s ease;
}
.pin::after {
  content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; margin-left: -5px;
  background: inherit; border-right: 1.5px solid var(--tag-ink); border-bottom: 1.5px solid var(--tag-ink);
  transform: rotate(45deg); border-bottom-right-radius: 2px;
}
.pin em { font: 500 12px/1 var(--f-body); font-style: normal; margin-left: 6px; }
.pin.best { background: var(--best); color: var(--best-ink); border-color: var(--best-ink); }
.pin.best::after { border-color: var(--best-ink); }
.pin.none { background: var(--tag-dim); color: var(--tag-dim-ink); border-color: var(--tag-dim-ink); }
.pin.none::after { border-color: var(--tag-dim-ink); }
.pin.sel { transform: translateX(-50%) scale(1.15); z-index: 2; background: var(--fg); color: var(--bg); border-color: var(--bg); }
.pin.sel::after { border-color: var(--bg); }
.pin.hid { opacity: .45; border-style: dashed; }
.pin.dot { font-size: 0; padding: 0; width: 12px; height: 12px; border-radius: 50%; bottom: -6px; border-width: 1.5px; }
.pin.dot em { display: none; }
.pin.dot::after { display: none; }
.pick-mode #map { cursor: crosshair; }
.draft-pin { position: absolute; transform: translate(-50%, -100%); font: 600 22px/1 var(--f-body); color: var(--danger); }

/* sheet */
.sheet {
  position: absolute; z-index: 1050; background: var(--surface); box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-height: 0;
  left: 0; right: 0; bottom: 0; max-height: 50%; border-radius: 14px 14px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: max-height .2s ease;
}
.sheet.expanded { max-height: 86%; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 16px 8px; }
.sheet-grip { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 2px; border: 0; padding: 0; }
.sheet-title { font: 800 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.sheet-body { overflow-y: auto; padding: 4px 16px 16px; min-height: 0; overscroll-behavior: contain; border-top: 1px solid var(--line); }
@media (min-width: 900px) {
  .sheet { left: 16px; top: 16px; bottom: 16px; right: auto; width: 390px; max-height: none; border-radius: 12px; }
  .sheet.expanded { max-height: none; }
  .sheet-grip { display: none; }
  .sheet-head { padding-top: 12px; }
  .leaflet-left .leaflet-control { margin-left: 422px; }
}

/* list controls */
.controls { display: grid; gap: 8px; padding: 0 16px 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); padding: 8px 6px; font-weight: 600; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.filter { display: grid; grid-template-columns: auto 1fr 3.6em; align-items: center; gap: 10px; font-size: 13px; }
.filter label { font-weight: 600; }
.filter input { width: 100%; accent-color: var(--best); }
.filter output { font: 600 13px/1 var(--f-mono); text-align: right; }

/* list */
.list { list-style: none; margin: 0; padding: 0; }
.row {
  width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px;
  text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0;
}
.row:hover .row-name { text-decoration: underline; }
.row-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-meta { color: var(--muted); font-size: 13px; grid-column: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-price { grid-row: 1 / span 2; grid-column: 2; text-align: right; font: 600 17px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.row-price small { display: block; font: 500 12px/1.3 var(--f-mono); color: var(--muted); }
.row-price.none { color: var(--muted); font-size: 13px; font-family: var(--f-body); font-weight: 500; }
.row.best .row-price b { background: var(--best); color: var(--best-ink); padding: 2px 6px; border-radius: 5px; font-weight: 600; }
.best-chip { display: inline-block; margin-left: 6px; font: 600 10px/1.6 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--best); vertical-align: 2px; }
.list-note { color: var(--muted); font-size: 13px; margin: 10px 0 2px; }
.stat { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 8px 0 4px; }
.stat b { color: var(--fg); font-family: var(--f-mono); font-weight: 600; }

/* venue card */
.v-meta { color: var(--muted); font-size: 13px; margin: 8px 0 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.drink { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-bottom: 10px; }
.drink.best { border-color: var(--best); box-shadow: inset 3px 0 0 var(--best); }
.drink-k { grid-column: 1 / -1; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.drink-k .best-chip { margin-left: 4px; vertical-align: 0; }
.drink-p { font: 600 30px/1 var(--f-mono); font-variant-numeric: tabular-nums; align-self: center; }
.drink-p.none { font: 500 15px/1.3 var(--f-body); color: var(--muted); }
.drink-d { min-width: 0; align-self: center; display: grid; gap: 4px; }
.drink-d strong { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; line-height: 1.25; }
.drink-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.drink-tags span { font: 500 12px/1 var(--f-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; color: var(--muted); }
.drink-src { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; }
.drink-src .user { color: var(--ok); font-weight: 600; }
.drink-src .disputed { color: var(--danger); font-weight: 600; }
.vote { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.vote > span { color: var(--muted); margin-right: 2px; }
.vote .btn { min-height: 32px; padding: 3px 10px; font-family: var(--f-mono); font-size: 13px; }
.vote .btn.on-up { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.vote .btn.on-down { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.drink-actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 4px; }
details.hist { margin-top: 6px; }
details.hist summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 6px 0; }
.hist-item { border-bottom: 1px solid var(--line); padding: 8px 0; font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.hist-item.hidden-r { opacity: .55; text-decoration: line-through; }
.hist-item .hp { font-family: var(--f-mono); font-weight: 600; }
.hist-item .hm { color: var(--muted); grid-column: 1 / -1; overflow-wrap: anywhere; }
.hist-item .ha { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.notice { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.photos { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.photos-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.photos-head h3 { margin: 0; font: 800 16px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.photo-main { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.photo-main img { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; }
.photo-cap { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.thumbs { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
.thumbs button { flex: none; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: 64px; height: 64px; background: var(--bg); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-empty { font-size: 13px; color: var(--muted); margin: 0; }
.editor-zone { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); align-items: center; }
.editor-zone > span { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); width: 100%; }

/* overlay form */
.overlay { position: absolute; inset: 0; z-index: 1300; background: rgba(10, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.panel { background: var(--surface); width: 100%; max-width: 460px; max-height: 92%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
@media (min-width: 640px) { .panel { border-radius: 14px; padding: 20px 22px; } }
.panel h2 { margin: 0 0 4px; font: 800 24px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.panel .sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; }
.field label em { font-style: normal; font-weight: 400; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 16px;
}
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.panel .seg { grid-template-columns: 1fr 1fr; margin-bottom: 12px; }
.panel .seg button { padding: 10px; font-size: 14px; }
.form-err { color: var(--danger); font-size: 13px; margin: 0 0 10px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.photo-prev { max-height: 120px; border-radius: 6px; margin-top: 6px; }

/* banners */
.pick-mode .sheet { display: none; }
.pick-hint { white-space: nowrap; position: absolute; z-index: 1200; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 999px; padding: 6px 6px 6px 16px; display: flex; gap: 10px; align-items: center; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.pick-hint .btn { min-height: 30px; padding: 2px 10px; background: var(--bg); color: var(--fg); border: 0; }
.toast { position: absolute; z-index: 1400; left: 50%; top: 72px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.gate { position: absolute; inset: 0; z-index: 1500; background: var(--bg); display: grid; place-items: center; padding: 16px; }
.gate-card { max-width: 380px; text-align: center; display: grid; justify-items: center; gap: 18px; }

.gate-card .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.lightbox img { max-height: 90%; max-width: 100%; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<div id="app">
  <header class="bar">
    <div class="brand">
      <h1 class="logo" aria-label="TabFriendly"><svg aria-hidden="true"><use href="#i-pint"/></svg><span><span class="w1">Tab</span><span class="w2">Friendly</span></span></h1>
      <p>Cheapest drinks within 1 mile of 77 Mass Ave</p>
    </div>
    <button class="btn" id="addVenueBtn" type="button"><span>+ Add<span class="add-long"> a</span> venue</span></button>
  </header>
  <div id="mapWrap">
    <div id="map" role="application" aria-label="Map of bars and restaurants near 77 Massachusetts Ave"></div>
    <aside class="sheet" id="sheet" aria-live="polite">
      <button class="sheet-grip" id="grip" type="button" aria-label="Expand or collapse list"></button>
      <div class="sheet-head" id="sheetHead"></div>
      <div class="controls" id="controls">
        <div class="seg" role="group" aria-label="What to compare">
          <button type="button" data-mode="beer" aria-pressed="true">Cheapest beer</button>
          <button type="button" data-mode="mixed" aria-pressed="false">Cheapest drink</button>

    <div class="pick-hint" id="pickHint" hidden>

  <div class="overlay" id="formOverlay" hidden>

  </div>
  <input type="file" id="photoPick" accept="image/*" hidden>
  <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="Menu photo submitted by a user"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <div class="logo big" aria-label="TabFriendly"><svg aria-hidden="true"><use href="#i-pint"/></svg><span><span class="w1">Tab</span><span class="w2">Friendly</span></span></div>
      <p>This map lists drink prices at bars and restaurants. Are you 21 or older?</p>
      <div class="btns">

        <button class="btn" type="button" id="gateNo">No</button>

    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  "use strict";
  const MIT = [42.35916, -71.09348];          // 77 Massachusetts Ave
  const RADIUS_M = 1609.34;                     // 1 mile
  const AREAS = [
    ["Kendall Sq", 42.3626, -71.0855], ["Central Sq", 42.3652, -71.1035], ["Cambridgeport", 42.3575, -71.1075],
    ["Back Bay", 42.3500, -71.0805], ["Kenmore", 42.3482, -71.0965], ["Fenway", 42.3437, -71.1000],
    ["MIT", 42.3612, -71.0950],
  ];
  const MODES = {
    beer: { title: "Cheapest beer nearby", label: "beer" },
    mixed: { title: "Cheapest mixed drinks nearby", label: "mixed drink" },
    overall: { title: "Cheapest drinks nearby", label: "drink" },
  };
  const SLIDER_MAX = 20;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } },
  };
  const icon = (id, extra = "") => `<svg class="ico" ${extra} aria-hidden="true"><use href="#${id}"/></svg>`;

  const S = {
    db: null, dbState: "loading", me: null, canWrite: null, canMod: false,
    venues: new Map(), reports: [], mod: new Map(), votes: new Map(),
    photos: [], photosFor: null, unsubPhotos: null,
    selected: null, picking: false, readOnlyAfterRefusal: false, histOpen: false,
    mode: ["beer", "mixed", "overall"].includes(store.get("tf-mode")) ? store.get("tf-mode") : "beer",
    maxPrice: null, best: new Set(),
  };

  // ---------- helpers ----------
  function distMi(lat, lng) {
    const R = 3958.8, toR = Math.PI / 180;
    const dLat = (lat - MIT[0]) * toR, dLng = (lng - MIT[1]) * toR;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(MIT[0] * toR) * Math.cos(lat * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  const money = (p) => "$" + (Number.isInteger(p) ? String(p) : p.toFixed(2));
  const perOz = (r) => (r && r.oz ? Math.round((r.price / r.oz) * 100) + "¢/oz" : "");
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function checked(s) {
    const m = /^(\d{4})-(\d{2})/.exec(s || "");
    return m ? "checked " + MONTHS[+m[2] - 1] + " " + m[1] : "undated";
  }
  function fmtDay(iso) {
    const d = new Date(iso);
    return isNaN(d) ? "" : MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }
  function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }
  const safeUrl = (u) => (typeof u === "string" && /^https:\/\//i.test(u) ? u : null);

  // How the drink is served. New reports store it; for researched ones, read it from the name.
  const SERVE_LABEL = { draft: "Draft", bottle: "Bottle", can: "Can", well: "Well drink", cocktail: "Cocktail" };
  function serveOf(r) {
    if (r.serve && SERVE_LABEL[r.serve]) return r.serve;
    const n = (r.drink || "").toLowerCase();
    if (r.kind === "beer") {
      if (/draft|draught|on tap|shorty|cup/.test(n)) return "draft";
      if (/\bcan\b|cans/.test(n) && !/bottle/.test(n)) return "can";
      if (/bottle/.test(n) && !/\bcan\b/.test(n)) return "bottle";
      return null;
    }
    return /\bwell\b/.test(n) ? "well" : "cocktail";
  }
  // The drink name without the serving words already shown as a tag.
  function cleanName(r) {
    return (r.drink || "").replace(/\s*\((draft|draught|bottle|can|can\/bottle|bottle\/can|bottle or can)[^)]*\)\s*$/i, "").trim() || r.drink;
  }

  const isHidden = (id) => S.mod.get(id)?.hidden === true;
  function reportsFor(venueId) {
    return S.reports.filter((r) => r.venueId === venueId).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  }
  function current(venueId, kind) {
    return reportsFor(venueId).find((r) => r.kind === kind && !isHidden(r.id)) || null;
  }
  // The report the current mode compares on.
  function pick(venueId, mode = S.mode) {
    if (mode !== "overall") return current(venueId, mode);
    const b = current(venueId, "beer"), m = current(venueId, "mixed");
    if (!b) return m;
    if (!m) return b;
    return m.price < b.price ? m : b;
  }
  function allVenues() {
    return [...S.venues.values()].filter((v) => S.canMod || !isHidden(v.id));
  }
  // Venues that pass the price filter, plus their priced report for the mode.
  function shownVenues() {
    return allVenues().map((v) => ({ v, r: pick(v.id) })).filter(({ r }) => S.maxPrice == null || (r && r.price <= S.maxPrice));
  }
  function computeBest(items) {
    const priced = items.filter((x) => x.r && !isHidden(x.v.id)).sort((a, b) => a.r.price - b.r.price || distMi(a.v.lat, a.v.lng) - distMi(b.v.lat, b.v.lng));
    S.best = new Set(priced.slice(0, 3).map((x) => x.v.id));
  }
  function tally(reportId) {
    let up = 0, down = 0, mine = 0;
    for (const [uid, doc] of S.votes) {
      const v = doc[reportId];
      if (v === 1) up++; else if (v === -1) down++;
      if (uid === S.me && (v === 1 || v === -1)) mine = v;
    }
    return { up, down, mine };
  }

  // ---------- map ----------
  const map = L.map("map", {
    preferCanvas: true, zoomSnap: 0.25, minZoom: 12.75, maxZoom: 19, zoomControl: true, attributionControl: true,
    maxBounds: [[42.30, -71.17], [42.41, -71.02]], maxBoundsViscosity: 0.8,
  });
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution('Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');
  map.zoomControl.setPosition("topright");
  const wide = matchMedia("(min-width: 900px)");
  function fitRadius() {
    const b = L.latLng(MIT).toBounds(RADIUS_M * 2);
    map.fitBounds(b, wide.matches ? { paddingTopLeft: [422, 16], paddingBottomRight: [16, 16] } : { paddingTopLeft: [8, 8], paddingBottomRight: [8, map.getSize().y * 0.5] });
  }
  fitRadius();

  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const base = { water: [], parks: [], rail: [], minor: [], mid: [], major: [], radius: null };
  function styleBase() {
    const z = map.getZoom(), k = Math.max(0.6, (z - 13) / 2.5);
    base.water.forEach((l) => l.setStyle({ stroke: false, fillColor: css("--water"), fillOpacity: 1 }));
    base.parks.forEach((l) => l.setStyle({ stroke: false, fillColor: css("--park"), fillOpacity: 1 }));
    base.rail.forEach((l) => l.setStyle({ color: css("--rail"), weight: 1.5 * k, dashArray: "4 4" }));
    base.minor.forEach((l) => l.setStyle({ color: css("--road"), weight: 2.2 * k }));
    base.mid.forEach((l) => l.setStyle({ color: css("--road-mid"), weight: 3.4 * k }));
    base.major.forEach((l) => l.setStyle({ color: css("--road-major"), weight: 4.6 * k }));
    if (base.radius) base.radius.setStyle({ color: css("--radius"), weight: 1.5, dashArray: "6 6", fill: false });
  }
  base.radius = L.circle(MIT, { radius: RADIUS_M, interactive: false }).addTo(map);
  L.marker(MIT, { icon: L.divIcon({ className: "", html: '<span class="mit-dot" title="77 Massachusetts Ave"></span>', iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(map);
  AREAS.forEach(([name, lat, lng]) => L.marker([lat, lng], { icon: L.divIcon({ className: "", html: `<span class="area-label">${esc(name)}</span>`, iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(map));
  L.marker([42.3545, -71.0905], { icon: L.divIcon({ className: "", html: '<span class="area-label river">Charles River</span>', iconSize: [0, 0] }), interactive: false, keyboard: false }).addTo(map);

  // basemap.json stores each line as delta-encoded ints in 1e-5 degrees (see tools/basemap_build.py)
  function dec(flat, b) {
    const pts = [];
    let y = Math.round(b[0] * 1e5), x = Math.round(b[1] * 1e5);
    for (let i = 0; i < flat.length; i += 2) { y += flat[i]; x += flat[i + 1]; pts.push([y / 1e5, x / 1e5]); }
    return pts;
  }
  fetch("basemap.json").then((r) => r.json()).then((bm) => {
    const opt = { interactive: false, smoothFactor: 1 }, b = bm.base;
    bm.water.forEach((p) => base.water.push(L.polygon(p.map((r) => dec(r, b)), opt).addTo(map)));
    bm.parks.forEach((p) => base.parks.push(L.polygon(p.map((r) => dec(r, b)), opt).addTo(map)));
    bm.rail.forEach((p) => base.rail.push(L.polyline(dec(p, b), opt).addTo(map)));
    ["minor", "mid", "major"].forEach((c) => bm.roads[c].forEach((p) => base[c].push(L.polyline(dec(p, b), opt).addTo(map))));
    base.radius.bringToFront();
    styleBase();
  }).catch(() => toast("The street map didn't load. Venues still show, without streets."));
  map.on("zoomend", styleBase);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", styleBase);
  new MutationObserver(styleBase).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // venue pins
  const markers = new Map();
  function pinFor(v, r) {
    const sel = S.selected === v.id;
    const cls = ["pin", r ? (S.best.has(v.id) ? "best" : "") : "none", sel ? "sel" : "", isHidden(v.id) ? "hid" : ""].filter(Boolean).join(" ");
    let label = r ? esc(money(r.price)) : "?";
    if (sel && r) {
      const n = cleanName(r);
      label += `<em>${esc(n.length > 24 ? n.slice(0, 23) + "…" : n)}</em>`;
    }
    return { html: `<span class="${cls}">${label}</span>`, z: r ? Math.round(1000 - r.price * 40) : 0 };
  }
  function renderPins(items) {
    const seen = new Set();
    for (const { v, r } of items) {
      seen.add(v.id);
      const { html, z } = pinFor(v, r);
      let m = markers.get(v.id);
      if (!m) {
        m = L.marker([v.lat, v.lng], { title: v.name, riseOnHover: true, keyboard: true });
        m.on("click", () => {
          if (S.picking) return toast(`${S.venues.get(v.id)?.name || "That venue"} is already on the map. Tap an empty spot.`);
          select(v.id);
        });
        m.addTo(map);
        markers.set(v.id, m);
      }
      m.setLatLng([v.lat, v.lng]);
      if (m._tfHtml !== html) {
        m.setIcon(L.divIcon({ className: "pin-wrap", html, iconSize: null }));
        m._tfHtml = html;
      }
      m.setZIndexOffset(S.selected === v.id ? 6000 : S.best.has(v.id) ? 3000 + z : z);
    }
    for (const [id, m] of markers) if (!seen.has(id)) { m.remove(); markers.delete(id); }
    declutter();
  }

  // Where tags would overlap, keep the cheapest as a full tag and shrink the rest to dots.
  function declutter() {
    const items = [...markers.entries()].map(([id, m]) => ({ id, m, p: map.latLngToContainerPoint(m.getLatLng()), r: pick(id) }));
    const rank = (x) => (x.id === S.selected ? -2 : S.best.has(x.id) ? -1 : 0);
    items.sort((a, b) => rank(a) - rank(b) || (a.r ? a.r.price : 1e9) - (b.r ? b.r.price : 1e9));
    const placed = [];
    for (const it of items) {
      const el = it.m.getElement()?.querySelector(".pin");
      if (!el) continue;
      const w = el.textContent.length * 8 + 18, h = 26;
      const box = { x1: it.p.x - w / 2 - 2, x2: it.p.x + w / 2 + 2, y1: it.p.y - h - 8, y2: it.p.y + 2 };
      const keep = rank(it) < 0;
      const hit = !keep && placed.some((b) => box.x1 < b.x2 && box.x2 > b.x1 && box.y1 < b.y2 && box.y2 > b.y1);
      el.classList.toggle("dot", hit);
      if (!hit) placed.push(box);
    }
  }
  map.on("zoomend resize", declutter);

  // ---------- sheet ----------
  const sheet = $("sheet"), head = $("sheetHead"), body = $("sheetBody"), controls = $("controls");
  $("grip").addEventListener("click", () => sheet.classList.toggle("expanded"));

  // mode toggle + price filter (static DOM so a live update never interrupts a drag)
  const modeBtns = controls.querySelectorAll("[data-mode]");
  function syncControls() {
    modeBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)));
    $("maxOut").textContent = S.maxPrice == null ? "Any" : "≤ " + money(S.maxPrice);
  }
  modeBtns.forEach((b) => b.addEventListener("click", () => { S.mode = b.dataset.mode; store.set("tf-mode", S.mode); syncControls(); render(); }));
  $("maxPrice").addEventListener("input", (e) => {
    const v = Number(e.target.value);
    S.maxPrice = v >= SLIDER_MAX ? null : v;
    syncControls(); render();
  });
  syncControls();

  function render() {
    const items = shownVenues();
    computeBest(items);
    // keep the selected venue on the map even if the filter would hide it
    if (S.selected && S.venues.has(S.selected) && !items.some((x) => x.v.id === S.selected)) {
      items.push({ v: S.venues.get(S.selected), r: pick(S.selected) });
    }
    renderPins(items);
    if (S.selected && S.venues.has(S.selected)) renderVenue(S.venues.get(S.selected));
    else { if (S.selected) select(null); else renderList(items); }
  }

  function renderList(items) {
    controls.hidden = false;
    head.innerHTML = `<h2 class="sheet-title">${MODES[S.mode].title}</h2>`;
    if (S.dbState === "loading") { body.innerHTML = `<p class="list-note">Loading venues and prices…</p>`; return; }
    if (S.dbState === "none") {
      body.innerHTML = `<div class="notice">Prices live in TabFriendly's shared database, which this view can't reach. Open the app from claude.ai while signed in to see venues and prices.</div>`;
      return;
    }
    if (!S.venues.size) {
      body.innerHTML = `<div class="notice">No venues yet. Tap <b>+ Add a venue</b> to put the first one on the map.</div>`;
      return;
    }
    const rows = items.map((x) => ({ ...x, d: distMi(x.v.lat, x.v.lng) }))
      .sort((a, b) => (a.r ? a.r.price : 1e9) - (b.r ? b.r.price : 1e9) || a.d - b.d);
    const priced = rows.filter((x) => x.r);
    let h = `<div class="stat"><span><b>${rows.length}</b> ${S.maxPrice == null ? "venues" : "at " + esc(money(S.maxPrice)) + " or less"}</span><span><b>${priced.length}</b> with a ${MODES[S.mode].label} price</span>${priced[0] ? `<span>from <b>${esc(money(priced[0].r.price))}</b></span>` : ""}</div>`;
    if (!rows.length) {
      body.innerHTML = h + `<div class="notice">Nothing at or under ${esc(money(S.maxPrice))} yet. Raise the max price, or report a cheaper drink you've found.</div>`;
      return;
    }
    h += `<ul class="list">`;
    for (const { v, r, d } of rows) {
      const best = S.best.has(v.id);
      let priceCell, meta;
      if (r) {
        const sub = r.kind === "beer" ? (perOz(r) || (r.oz ? r.oz + " oz" : "size n/a")) : "mixed";
        priceCell = `<span class="row-price"><b>${esc(money(r.price))}</b><small>${esc(S.mode === "overall" ? (r.kind === "beer" ? "beer" : "mixed") : sub)}</small></span>`;
        meta = esc(cleanName(r)) + " · " + d.toFixed(1) + " mi";
      } else {
        priceCell = `<span class="row-price none">Add price</span>`;
        meta = d.toFixed(1) + " mi";
      }
      h += `<li><button class="row${best ? " best" : ""}" type="button" data-v="${esc(v.id)}"><span class="row-name">${esc(v.name)}${best ? '<span class="best-chip">Top 3</span>' : ""}</span>${priceCell}<span class="row-meta">${meta}${isHidden(v.id) ? " · hidden" : ""}</span></button></li>`;
    }
    h += `</ul><p class="list-note">The three cheapest are in green. Prices come from published menus and from people like you. Spot a wrong one? Open the venue and update it.</p>`;
    body.innerHTML = h;
    body.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => select(b.dataset.v, true)));
  }

  const canPost = () => S.canWrite !== false && !S.readOnlyAfterRefusal && S.dbState === "ready";

  function drinkBlock(v, kind) {
    const r = current(v.id, kind);
    const label = kind === "beer" ? "Cheapest beer" : "Cheapest mixed drink";
    const isBest = r && S.best.has(v.id) && pick(v.id) === r;
    let h = `<div class="drink${isBest ? " best" : ""}"><span class="drink-k">${label}${isBest ? '<span class="best-chip">Top 3 nearby</span>' : ""}</span>`;
    if (!r) {
      h += `<span class="drink-p none">No price yet</span><span></span>`;
    } else {
      const tags = [];
      const sv = serveOf(r);
      if (sv) tags.push(SERVE_LABEL[sv]);
      if (kind === "beer") {
        if (r.oz) tags.push(r.oz + " oz", perOz(r)); else tags.push("pour size not listed");
      }
      h += `<span class="drink-p">${esc(money(r.price))}</span><span class="drink-d"><strong>${esc(cleanName(r))}</strong><span class="drink-tags">${tags.map((t) => `<span>${esc(t)}</span>`).join("")}</span></span>`;
      if (r.source === "user") {
        const t = tally(r.id);
        const disputed = t.down > t.up;
        h += `<div class="drink-src"><span class="user">User-reported</span><span>${esc(fmtDay(r.at))}</span>${r.note ? `<span>“${esc(r.note)}”</span>` : ""}${disputed ? '<span class="disputed">Disputed</span>' : ""}</div>`;
        const mineReport = S.me && r.by === S.me;
        const canVote = S.me && !mineReport && canPost();
        h += `<div class="vote"><span>${mineReport ? "Your report:" : "Is this price right?"}</span>`
          + `<button class="btn${t.mine === 1 ? " on-up" : ""}" type="button" data-vote="${esc(r.id)}" data-val="1" aria-pressed="${t.mine === 1}" ${canVote ? "" : "disabled"} aria-label="Yes, this price is right">${icon("i-up")} ${t.up}</button>`
          + `<button class="btn${t.mine === -1 ? " on-down" : ""}" type="button" data-vote="${esc(r.id)}" data-val="-1" aria-pressed="${t.mine === -1}" ${canVote ? "" : "disabled"} aria-label="No, this price is wrong">${icon("i-up", 'style="transform:rotate(180deg)"')} ${t.down}</button></div>`;
      } else {
        const u = safeUrl(r.sourceUrl);
        h += `<div class="drink-src"><span>Source: ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(hostOf(u))}</a>` : "published menu"}</span><span>${esc(checked(r.sourceDate))}</span></div>`;
      }
    }
    const acts = [];
    if (canPost()) acts.push(`<button class="btn small ${r ? "" : "tag"}" type="button" data-report="${kind}">${r ? "Update price" : "Add price"}</button>`);
    if (S.canMod && r) acts.push(`<button class="btn small danger" type="button" data-del-report="${esc(r.id)}">Delete price</button>`);
    if (acts.length) h += `<div class="drink-actions">${acts.join("")}</div>`;
    return h + `</div>`;
  }

  function photosBlock(v) {
    let h = `<section class="photos"><div class="photos-head"><h3>Menu</h3>${canPost() ? `<button class="btn small" type="button" id="addPhotoBtn">${icon("i-cam")} Add menu photo</button>` : ""}</div>`;
    if (S.photosFor !== v.id) return h + `<p class="photo-empty">Loading photos…</p></section>`;
    const ps = S.photos.filter((p) => typeof p.data === "string" && p.data.startsWith("data:image/"));
    if (!ps.length) return h + `<p class="photo-empty">No menu photo yet.${canPost() ? " Snap one next time you're there." : ""}</p></section>`;
    const [first, ...rest] = ps;
    h += `<button class="photo-main" type="button" data-photo="${esc(first.id)}" aria-label="Open menu photo"><img src="${esc(first.data)}" alt="Menu photo of ${esc(v.name)}"></button>`;
    h += `<p class="photo-cap">Added ${esc(fmtDay(first.at)) || "by a user"}${S.me && first.by === S.me ? " by you" : ""}</p>`;
    if (rest.length) h += `<div class="thumbs">${rest.map((p) => `<button type="button" data-photo="${esc(p.id)}" aria-label="Open older menu photo"><img src="${esc(p.data)}" alt=""></button>`).join("")}</div>`;
    return h + `</section>`;
  }

  function renderVenue(v) {
    controls.hidden = true;
    head.innerHTML = `<button class="btn small ghost" type="button" id="backBtn" aria-label="Back to list">←</button><h2 class="sheet-title">${esc(v.name)}</h2>`;
    const d = distMi(v.lat, v.lng);
    let h = `<div class="v-meta"><span class="chip">${v.type === "restaurant" ? "Restaurant" : "Bar"}</span>${v.address ? `<span>${esc(v.address)}</span>` : ""}<span>${d.toFixed(2)} mi from 77 Mass Ave</span>${safeUrl(v.website) ? `<a href="${esc(v.website)}" target="_blank" rel="noopener">Website</a>` : ""}</div>`;
    if (v.note) h += `<div class="notice">${esc(v.note)}</div>`;
    if (isHidden(v.id)) h += `<div class="notice">This venue is hidden from everyone but editors.</div>`;
    h += drinkBlock(v, "beer") + drinkBlock(v, "mixed");
    if (S.canWrite === false || S.readOnlyAfterRefusal) h += `<div class="notice">You can view prices but not post them. Ask the TabFriendly team for Contributor access to submit.</div>`;
    const hist = reportsFor(v.id).filter((r) => S.canMod || !isHidden(r.id));
    if (hist.length) {
      h += `<details class="hist" id="hist"${S.histOpen ? " open" : ""}><summary>Price history (${hist.length})</summary>`;
      for (const r of hist) {
        const hidden = isHidden(r.id);
        const t = r.source === "user" ? tally(r.id) : null;
        h += `<div class="hist-item${hidden ? " hidden-r" : ""}"><span>${r.kind === "beer" ? "Beer" : "Mixed"} · ${esc(cleanName(r))}${r.oz ? " · " + esc(r.oz) + " oz" : ""}</span><span class="hp">${esc(money(r.price))}</span>`
          + `<span class="hm">${r.source === "user" ? "User-reported " + esc(fmtDay(r.at)) + (S.me && r.by === S.me ? " (you)" : "") + (t && (t.up || t.down) ? ` · ${t.up} yes / ${t.down} no` : "") : "From " + esc(hostOf(r.sourceUrl) || "published menu") + ", " + esc(checked(r.sourceDate))}${r.note ? " · “" + esc(r.note) + "”" : ""}</span>`;
        if (S.canMod) h += `<span class="ha">${hidden ? `<button class="btn small" type="button" data-mod-restore="${esc(r.id)}">Restore</button>` : `<button class="btn small" type="button" data-mod-hide="${esc(r.id)}">Hide as wrong</button>`}<button class="btn small danger" type="button" data-del-report="${esc(r.id)}">Delete</button></span>`;
        h += `</div>`;
      }
      h += `</details>`;
    }
    h += photosBlock(v);
    if (S.canMod) {
      h += `<div class="editor-zone"><span>Editor tools</span>`
        + (isHidden(v.id) ? `<button class="btn small" type="button" data-mod-restore="${esc(v.id)}">Restore venue</button>` : `<button class="btn small" type="button" data-mod-hide="${esc(v.id)}">Hide venue</button>`)
        + `<button class="btn small danger" type="button" id="delVenueBtn">Delete venue</button></div>`;
    }
    body.innerHTML = h;
    $("backBtn").addEventListener("click", () => select(null));
    $("hist")?.addEventListener("toggle", (e) => (S.histOpen = e.target.open));
    $("addPhotoBtn")?.addEventListener("click", () => { $("photoPick").value = ""; $("photoPick").click(); });
    $("delVenueBtn")?.addEventListener("click", (e) => armConfirm(e.currentTarget, () => deleteVenue(v)));
    body.querySelectorAll("[data-del-report]").forEach((b) => b.addEventListener("click", () => {
      const r = S.reports.find((x) => x.id === b.dataset.delReport);
      if (r) armConfirm(b, () => deleteReport(r));
    }));
    body.querySelectorAll("[data-report]").forEach((b) => b.addEventListener("click", () => openPriceForm(v.id, b.dataset.report)));
    body.querySelectorAll("[data-photo]").forEach((b) => b.addEventListener("click", () => showPhoto(b.dataset.photo)));
    body.querySelectorAll("[data-vote]").forEach((b) => b.addEventListener("click", () => vote(b.dataset.vote, Number(b.dataset.val))));
    body.querySelectorAll("[data-mod-hide]").forEach((b) => b.addEventListener("click", () => setHidden(b.dataset.modHide, true)));
    body.querySelectorAll("[data-mod-restore]").forEach((b) => b.addEventListener("click", () => setHidden(b.dataset.modRestore, false)));
  }

  function watchPhotos(venueId) {
    if (S.unsubPhotos) { S.unsubPhotos(); S.unsubPhotos = null; }
    S.photos = []; S.photosFor = null;
    if (!venueId || !S.db) return;
    S.unsubPhotos = S.db.collection("photos").where("venueId", "==", venueId).limit(20).onSnapshot((snap) => {
      S.photos = snap.docs.map((d) => ({ ...d.data(), id: d.id })).sort((a, b) => (b.at || "").localeCompare(a.at || ""));
      S.photosFor = venueId;
      if (S.selected === venueId) render();
    }, () => { S.photosFor = venueId; render(); });
  }

  function select(id, pan) {
    if (id !== S.selected) { S.histOpen = false; watchPhotos(id); }
    S.selected = id;
    render();
    if (id) {
      body.scrollTop = 0;
      const v = S.venues.get(id);
      if (v && (pan || !map.getBounds().pad(-0.15).contains([v.lat, v.lng]))) map.panTo([v.lat, v.lng]);
    }
  }

  // ---------- toast / lightbox ----------
  let toastT;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3500);
  }
  function showPhoto(id) {
    const p = S.photos.find((x) => x.id === id);
    if (!p) return;
    $("lightboxImg").src = p.data; $("lightbox").hidden = false;
  }
  $("lightbox").addEventListener("click", () => ($("lightbox").hidden = true));

  // ---------- writes ----------
  function writeError(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.readOnlyAfterRefusal = true; return "You don't have permission to post here. Ask the TabFriendly team for Contributor access."; }
    if (code === "quota_exceeded") return "The database is full, so nothing new can be saved. Let the TabFriendly team know.";
    if (code === "resource_exhausted") return "Too many requests at once. Wait a few seconds and try again.";
    return "Couldn't save right now. Check your connection and try again.";
  }

  let voting = false;
  async function vote(reportId, val) {
    if (!S.me || voting) return;
    const mine = { ...(S.votes.get(S.me) || {}) };
    if (mine[reportId] === val) delete mine[reportId]; else mine[reportId] = val;
    voting = true;
    try { await S.db.doc("votes/" + S.me).set(mine); }
    catch (e) { toast(e && e.code === "invalid_argument" ? "Your vote couldn't be saved. You may need Contributor access." : writeError(e)); }
    finally { voting = false; }
  }

  async function shrinkPhoto(file) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file);
    });
    for (const [max, q] of [[1200, 0.7], [1000, 0.62], [800, 0.55], [600, 0.5]]) {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", q);
      if (url.length < 230000) return url;
    }
    throw new Error("too big");
  }
  $("photoPick").addEventListener("change", async (e) => {
    const f = e.target.files[0], venueId = S.selected;
    if (!f || !venueId) return;
    toast("Uploading photo…");
    try {
      const data = await shrinkPhoto(f);
      await S.db.collection("photos").doc().set({ venueId, data, by: S.me, at: new Date().toISOString() });
      toast("Menu photo added. Thanks!");
    } catch (err) {
      toast(err && err.code ? writeError(err) : "That photo couldn't be read. Try a JPEG or PNG.");
    }
  });

  async function setHidden(id, hidden) {
    try {
      if (hidden) await S.db.doc("mod/" + id).set({ hidden: true, by: S.me, at: new Date().toISOString() });
      else await S.db.doc("mod/" + id).delete();
      toast(hidden ? "Hidden." : "Restored.");
    } catch (e) { toast(writeError(e)); }
  }

  // Deletes ask for a second tap (the viewer blocks confirm() dialogs).
  function armConfirm(btn, run) {
    if (!btn.classList.contains("armed")) {
      const label = btn.textContent;
      btn.classList.add("armed");
      btn.textContent = "Tap again to delete for good";
      setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = label; } }, 5000);
      return;
    }
    btn.disabled = true;
    run();
  }
  // Remove one price report; the venue's next most recent price (if any) becomes current.
  async function deleteReport(r) {
    try {
      if (r.hasPhoto) await S.db.doc("photos/" + r.id).delete();
      if (S.mod.has(r.id)) await S.db.doc("mod/" + r.id).delete();
      await S.db.doc("reports/" + r.id).delete();
      const next = reportsFor(r.venueId).find((x) => x.id !== r.id && x.kind === r.kind && !isHidden(x.id));
      const what = r.kind === "beer" ? "beer" : "mixed drink";
      toast(next ? `Price deleted. The previous ${what} price, ${money(next.price)}, shows now.` : `Price deleted. This venue has no ${what} price now.`);
    } catch (e) { toast(writeError(e)); }
  }
  async function deleteVenue(v) {
    const id = v.id;
    try {
      const photos = await S.db.collection("photos").where("venueId", "==", id).limit(100).get();
      for (const d of photos.docs) await S.db.doc("photos/" + d.id).delete();
      for (const r of S.reports.filter((x) => x.venueId === id)) {
        await S.db.doc("reports/" + r.id).delete();
        if (S.mod.has(r.id)) await S.db.doc("mod/" + r.id).delete();
      }
      if (S.mod.has(id)) await S.db.doc("mod/" + id).delete();
      await S.db.doc("venues/" + id).delete();
      select(null);
      toast(`${v.name} deleted.`);
    } catch (e) { toast(writeError(e)); }
  }

  // ---------- forms ----------
  const overlay = $("formOverlay"), form = $("form");
  function closeForm() { overlay.hidden = true; form.innerHTML = ""; clearDraft(); }
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeForm(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("lightbox").hidden) $("lightbox").hidden = true;
    else if (!overlay.hidden) closeForm();
    else if (S.picking) stopPick();
  });

  function openPriceForm(venueId, kind, fresh) {
    const v = S.venues.get(venueId);
    if (!v) return;
    let k = kind || "beer";
    let photo = null;
    let dirty = false;  // has the person typed anything since the form was filled?
    const draw = () => {
      const cur = current(venueId, k);
      const serveOpts = k === "beer"
        ? `<option value="">Not sure</option><option value="draft">Draft</option><option value="bottle">Bottle</option><option value="can">Can</option>`
        : `<option value="">Not sure</option><option value="well">Well drink</option><option value="cocktail">Cocktail</option>`;
      form.innerHTML = `
        <h2>${fresh ? "Add a first price" : cur ? "Update price" : "Report a price"}</h2>
        <p class="sub">${esc(v.name)} · ${cur ? "change what's different; it" : "it"} shows on the map right away.</p>
        <div class="seg" role="group" aria-label="Drink type">
          <button type="button" id="kBeer" aria-pressed="${k === "beer"}">Cheapest beer</button>
          <button type="button" id="kMixed" aria-pressed="${k === "mixed"}">Cheapest mixed drink</button>
        </div>
        <div class="field"><label for="fDrink">${k === "beer" ? "Beer brand and name" : "Drink name"}</label><input id="fDrink" maxlength="80" autocomplete="off" placeholder="${k === "beer" ? "e.g. Narragansett Lager" : "e.g. Rum & coke"}" required></div>
        <div class="two">
          <div class="field"><label for="fPrice">Price ($)</label><input id="fPrice" inputmode="decimal" placeholder="6.00" required></div>
          <div class="field"><label for="fServe">${k === "beer" ? "Served as" : "Type"} <em>optional</em></label><select id="fServe">${serveOpts}</select></div>
        </div>
        ${k === "beer" ? `<div class="field"><label for="fOz">Pour size (oz) <em>optional</em></label><input id="fOz" inputmode="decimal" placeholder="16"></div>` : ""}
        <div class="field"><label for="fNote">Note <em>optional</em></label><input id="fNote" maxlength="200" placeholder="e.g. cash only, cans only"></div>
        <div class="field"><label for="fPhoto">Menu photo <em>optional</em></label><input id="fPhoto" type="file" accept="image/*"><img id="fPrev" class="photo-prev" alt="" hidden></div>
        <p class="form-err" id="fErr" hidden></p>
        <div class="form-actions"><button class="btn" type="button" id="fCancel">${fresh ? "Skip" : "Cancel"}</button><button class="btn tag" type="submit" id="fSubmit">Post price</button></div>`;
      const switchTo = (nk) => { if (nk === k) return; k = nk; if (dirty) keepDraw(); else { draw(); prefill(); } };
      $("kBeer").onclick = () => switchTo("beer");
      $("kMixed").onclick = () => switchTo("mixed");
      $("fCancel").onclick = closeForm;
      $("fPhoto").onchange = async (e) => {
        const f = e.target.files[0]; photo = null; $("fPrev").hidden = true;
        if (!f) return;
        try { photo = await shrinkPhoto(f); $("fPrev").src = photo; $("fPrev").hidden = false; }
        catch { showErr("That photo couldn't be read. Try a JPEG or PNG."); e.target.value = ""; }
      };
    };
    const keepDraw = () => {
      const keep = { d: $("fDrink").value, p: $("fPrice").value, n: $("fNote").value, o: $("fOz") ? $("fOz").value : "" };
      draw();
      $("fDrink").value = keep.d; $("fPrice").value = keep.p; $("fNote").value = keep.n; if ($("fOz")) $("fOz").value = keep.o;
      if (photo) { $("fPrev").src = photo; $("fPrev").hidden = false; }
    };
    // Start from the venue's current price for this drink, so an update only needs the parts that changed.
    const prefill = () => {
      const r = current(venueId, k);
      if (!r) return;
      $("fDrink").value = cleanName(r) || "";
      $("fPrice").value = Number.isInteger(r.price) ? String(r.price) : r.price.toFixed(2);
      const sv = serveOf(r);
      if (sv && [...$("fServe").options].some((o) => o.value === sv)) $("fServe").value = sv;
      if ($("fOz") && r.oz) $("fOz").value = String(r.oz);
      if (r.note) $("fNote").value = r.note;
      dirty = false;
    };
    const showErr = (m) => { $("fErr").textContent = m; $("fErr").hidden = false; };
    form.oninput = form.onchange = (e) => { if (e.target.id !== "fPhoto") dirty = true; };
    draw();
    prefill();
    form.onsubmit = async (e) => {
      e.preventDefault();
      const drink = $("fDrink").value.trim();
      const price = Number($("fPrice").value.replace(/[$,\s]/g, ""));
      const ozRaw = $("fOz") ? $("fOz").value.trim() : "";
      const oz = ozRaw ? Number(ozRaw.replace(/oz/i, "").trim()) : null;
      const serve = $("fServe").value || null;
      const note = $("fNote").value.trim();
      if (!drink) return showErr(k === "beer" ? "Enter the beer's brand and name." : "Enter the drink's name.");
      if (!(price > 0 && price <= 100)) return showErr("Enter a price between $0.01 and $100.");
      if (ozRaw && !(oz >= 4 && oz <= 64)) return showErr("Pour size should be between 4 and 64 oz, or leave it blank.");
      if (!S.db) return showErr("Can't reach the shared database from this view.");
      $("fSubmit").disabled = true;
      try {
        const ref = S.db.collection("reports").doc();
        const at = new Date().toISOString();
        if (photo) await S.db.doc("photos/" + ref.id).set({ venueId, data: photo, by: S.me, at });
        await ref.set({
          venueId, kind: k, drink, serve, price: Math.round(price * 100) / 100, oz: oz || null, note: note || null,
          hasPhoto: !!photo, source: "user", sourceUrl: null, sourceDate: null, by: S.me, at,
        });
        closeForm();
        toast("Price posted. Thanks!");
        select(venueId);
      } catch (err) {
        showErr(writeError(err));
        $("fSubmit").disabled = false;
      }
    };
    overlay.hidden = false;
    setTimeout(() => $("fDrink")?.focus(), 30);
  }

  // add venue: pick a point, then fill details
  let draft = null;
  function clearDraft() { if (draft) { draft.remove(); draft = null; } }
  function stopPick() { S.picking = false; $("pickHint").hidden = true; document.body.classList.remove("pick-mode"); }
  $("addVenueBtn").addEventListener("click", () => {
    if (S.dbState !== "ready") return toast("Venues can't be added from this view.");
    if (S.canWrite === false || S.readOnlyAfterRefusal) return toast("You need Contributor access to add venues.");
    S.picking = true; $("pickHint").hidden = false; document.body.classList.add("pick-mode");
    select(null);
  });
  $("pickCancel").addEventListener("click", stopPick);
  map.on("click", (e) => {
    if (!S.picking) return;
    const { lat, lng } = e.latlng;
    if (distMi(lat, lng) > 1) return toast("That spot is outside the 1-mile circle. Pick a place inside it.");
    stopPick();
    clearDraft();
    draft = L.marker([lat, lng], { icon: L.divIcon({ className: "", html: '<span class="draft-pin">▼</span>', iconSize: [0, 0] }), interactive: false }).addTo(map);
    openVenueForm(lat, lng);
  });

  function openVenueForm(lat, lng) {
    form.innerHTML = `
      <h2>Add a venue</h2>
      <p class="sub">${distMi(lat, lng).toFixed(2)} mi from 77 Mass Ave. Next you can add its prices.</p>
      <div class="field"><label for="vName">Name</label><input id="vName" maxlength="80" autocomplete="off" required></div>
      <div class="field"><label for="vType">Type</label><select id="vType"><option value="bar">Bar</option><option value="restaurant">Restaurant</option></select></div>
      <div class="field"><label for="vAddr">Street address <em>optional</em></label><input id="vAddr" maxlength="120" autocomplete="off" placeholder="e.g. 500 Massachusetts Ave"></div>
      <p class="form-err" id="vErr" hidden></p>
      <div class="form-actions"><button class="btn" type="button" id="vCancel">Cancel</button><button class="btn primary" type="submit" id="vSubmit">Add venue</button></div>`;
    $("vCancel").onclick = closeForm;
    form.onsubmit = async (e) => {
      e.preventDefault();
      const name = $("vName").value.trim();
      const err = (m) => { $("vErr").textContent = m; $("vErr").hidden = false; };
      if (!name) return err("Enter the venue's name.");
      const dup = [...S.venues.values()].find((v) => v.name.toLowerCase() === name.toLowerCase());
      if (dup) return err(`${dup.name} is already on the map. Close this and tap its pin to update prices.`);
      $("vSubmit").disabled = true;
      try {
        const ref = S.db.collection("venues").doc();
        const doc = { name, type: $("vType").value, address: $("vAddr").value.trim() || null, lat: +lat.toFixed(6), lng: +lng.toFixed(6), website: null, note: null, source: "user", by: S.me, at: new Date().toISOString() };
        await ref.set(doc);
        clearDraft();
        S.venues.set(ref.id, { ...doc, id: ref.id });
        toast(`${name} added.`);
        openPriceForm(ref.id, "beer", true);
      } catch (ex) { err(writeError(ex)); $("vSubmit").disabled = false; }
    };
    overlay.hidden = false;
    setTimeout(() => $("vName").focus(), 30);
  }

  // ---------- age gate ----------
  if (store.get("tf-21") !== "yes") $("gate").hidden = false;
  $("gateYes").addEventListener("click", () => { store.set("tf-21", "yes"); $("gate").hidden = true; });
  $("gateNo").addEventListener("click", () => { $("gateMsg").hidden = false; });

  // ---------- data ----------
  render();
  (async () => {
    const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
    if (user) {
      const [id, can, mod] = await Promise.all([user.id(), user.can("data.write"), user.canEdit()]);
      S.me = id; S.canWrite = can; S.canMod = mod;
    }
    if (!db) { S.dbState = "none"; render(); return; }
    S.db = db;
    let got = 0;
    const ready = () => { if (++got >= 2 && S.dbState === "loading") S.dbState = "ready"; };
    const onErr = (e) => { if (e.code === "revoked") { S.dbState = "none"; render(); } };
    db.collection("venues").limit(1000).onSnapshot((snap) => {
      S.venues = new Map();
      snap.docs.forEach((d) => {
        const v = d.data();
        if (typeof v.lat === "number" && typeof v.lng === "number" && v.name) S.venues.set(d.id, { ...v, id: d.id });
      });
      ready(); render();
    }, onErr);
    db.collection("reports").orderBy("at", "desc").limit(1000).onSnapshot((snap) => {
      S.reports = snap.docs.map((d) => ({ ...d.data(), id: d.id }))
        .filter((r) => r.venueId && (r.kind === "beer" || r.kind === "mixed") && typeof r.price === "number" && r.drink);
      ready(); render();
    }, onErr);
    db.collection("mod").limit(1000).onSnapshot((snap) => {
      S.mod = new Map(snap.docs.map((d) => [d.id, d.data()]));
      render();
    }, onErr);
    db.collection("votes").limit(1000).onSnapshot((snap) => {
      S.votes = new Map(snap.docs.map((d) => [d.id, d.data() || {}]));
      render();
    }, onErr);
  })();
})();
</script>
